<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>エージェント・タウン</title>
    <style>
      :root {
        --world-peat: #1d2428;
        --world-iron: #54646b;
        --world-parchment: #ded3b3;
        --world-ember: #d7864b;
        --world-verdigris: #6f9f91;
        --world-ley: #8878a6;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #1d2428;
      }

      canvas {
        display: block;
        touch-action: none;
      }

      canvas:focus-visible {
        outline: 2px solid #fff176;
        outline-offset: -2px;
      }

      /* Nation HUD. Reuses the --world-* palette so the nation layer and the chronicle read as one
         world rather than two apps sharing a tab. */
      .nation-clock {
        position: fixed;
        z-index: 8;
        top: 0;
        right: 0;
        left: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        box-sizing: border-box;
        padding: calc(0.5rem + env(safe-area-inset-top)) 0.75rem 0.5rem;
        color: var(--world-parchment);
        font-family: system-ui, sans-serif;
        background: rgb(29 36 40 / 92%);
        border-bottom: 1px solid var(--world-iron);
      }

      .nation-clock__headline {
        margin: 0;
        font-size: 1.05rem;
        font-variant-numeric: tabular-nums;
      }

      .nation-clock__countdown-label {
        color: var(--world-iron);
        font-size: 0.8rem;
      }

      .nation-clock__progress {
        width: min(14rem, 30vw);
        height: 0.5rem;
      }

      .nation-clock__countdown {
        min-width: 7rem;
        font-variant-numeric: tabular-nums;
      }

      /* The commit is close enough that "later" is no longer a plan. Colour only — the text already
         says how long is left, so nothing here is carried by hue alone. */
      .nation-clock__countdown--urgent {
        color: var(--world-ember);
        font-weight: 700;
      }

      .nation-clock__speeds {
        display: flex;
        gap: 0.25rem;
        margin-left: auto;
      }

      .nation-clock__speed {
        min-width: 2.75rem;
        min-height: 44px;
        color: var(--world-parchment);
        font-size: 0.9rem;
        background: transparent;
        border: 1px solid var(--world-iron);
        border-radius: 0.25rem;
        cursor: pointer;
      }

      .nation-clock__speed[aria-pressed="true"] {
        color: var(--world-peat);
        background: var(--world-parchment);
        border-color: var(--world-parchment);
      }

      .nation-clock__speed:focus-visible {
        outline: 2px solid #fff176;
        outline-offset: 2px;
      }

      /* Above every panel: while it is showing there is nothing underneath it worth seeing. */
      .nation-boot {
        position: fixed;
        z-index: 20;
        top: 50%;
        left: 50%;
        margin: 0;
        padding: 0.75rem 1.25rem;
        color: var(--world-parchment);
        font-family: system-ui, sans-serif;
        font-size: 0.9rem;
        background: rgb(29 36 40 / 92%);
        border: 1px solid var(--world-iron);
        border-radius: 0.25rem;
        transform: translate(-50%, -50%);
      }

      .nation-hud {
        position: fixed;
        z-index: 7;
        top: 4.5rem;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        gap: 0.75rem;
        justify-content: space-between;
        padding: 0 0.75rem calc(0.75rem + env(safe-area-inset-bottom));
        pointer-events: none;
      }

      .nation-dashboard,
      .prosperity {
        box-sizing: border-box;
        width: min(17rem, 32vw);
        max-height: 100%;
        padding: 0.75rem;
        overflow-y: auto;
        color: var(--world-parchment);
        font-family: system-ui, sans-serif;
        font-size: 0.85rem;
        background: rgb(29 36 40 / 88%);
        border: 1px solid var(--world-iron);
        border-radius: 0.25rem;
        pointer-events: auto;
      }

      .nation-dashboard__name,
      .prosperity__title {
        margin: 0 0 0.5rem;
        font-size: 1rem;
      }

      .nation-dashboard__own {
        margin-left: 0.5rem;
        padding: 0.1rem 0.4rem;
        color: var(--world-peat);
        font-size: 0.7rem;
        background: var(--world-verdigris);
        border-radius: 0.2rem;
      }

      .nation-dashboard__metrics,
      .nation-dashboard__directives,
      .prosperity__rows,
      .prosperity__contributions {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .nation-dashboard__metric {
        display: grid;
        grid-template-columns: 3.5rem 1fr auto;
        gap: 0.5rem;
        padding: 0.15rem 0;
        font-variant-numeric: tabular-nums;
      }

      .nation-dashboard__metric-value {
        text-align: right;
      }

      /* Direction is a glyph first (▲ ▼ ―) and a colour second, so the diff survives a colour-blind
         reader and a greyscale screenshot. */
      .nation-dashboard__delta {
        min-width: 3.5rem;
        text-align: right;
      }

      .nation-dashboard__delta--up {
        color: var(--world-verdigris);
      }

      .nation-dashboard__delta--down {
        color: var(--world-ember);
      }

      .nation-dashboard__delta--flat,
      .nation-dashboard__delta--unknown {
        color: var(--world-iron);
      }

      .nation-dashboard__section-title,
      .prosperity__subtitle {
        margin: 0.75rem 0 0.25rem;
        color: var(--world-iron);
        font-size: 0.75rem;
        font-weight: 400;
      }

      .nation-dashboard__directive {
        display: flex;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.15rem 0;
      }

      .nation-dashboard__empty,
      .nation-dashboard__waiting {
        margin: 0.25rem 0;
        color: var(--world-iron);
      }

      .prosperity__row,
      .prosperity__contribution {
        display: grid;
        grid-template-columns: 1.25rem 0.6rem 1fr auto;
        gap: 0.4rem;
        align-items: center;
        padding: 0.2rem 0;
        font-variant-numeric: tabular-nums;
      }

      .prosperity__row--own {
        background: rgb(111 159 145 / 18%);
      }

      .prosperity__swatch {
        width: 0.6rem;
        height: 0.6rem;
        background: var(--banner-color, var(--world-iron));
        border-radius: 0.15rem;
      }

      .prosperity__bar,
      .prosperity__contribution-bar {
        grid-column: 1 / -1;
        width: 100%;
        height: 0.35rem;
      }

      .prosperity__contribution {
        grid-template-columns: 3rem 1fr auto;
      }

      .prosperity__contribution--dragging {
        color: var(--world-ember);
      }

      /* The marker's meaning is spelled out rather than left to a colour or an arrow. */
      .prosperity__dragging-note {
        grid-column: 1 / -1;
        color: var(--world-ember);
        font-size: 0.7rem;
      }

      @media (width <= 40rem) {
        .nation-hud {
          top: 6.5rem;
          flex-direction: column;
          overflow-y: auto;
        }

        .nation-dashboard,
        .prosperity {
          width: 100%;
        }
      }

      .nation-select {
        position: fixed;
        z-index: 12;
        top: 50%;
        left: 50%;
        box-sizing: border-box;
        width: min(24rem, 90vw);
        padding: 1rem;
        color: var(--world-parchment);
        font-family: system-ui, sans-serif;
        background: rgb(29 36 40 / 97%);
        border: 1px solid var(--world-iron);
        border-radius: 0.35rem;
        transform: translate(-50%, -50%);
      }

      .nation-select__title {
        margin: 0 0 0.75rem;
        font-size: 1rem;
      }

      .nation-select__options {
        display: grid;
        gap: 0.4rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .nation-select__option {
        width: 100%;
        min-height: 44px;
        color: var(--world-parchment);
        font-size: 0.9rem;
        background: transparent;
        border: 1px solid var(--world-iron);
        border-radius: 0.25rem;
        cursor: pointer;
      }

      .nation-select__option:hover {
        background: rgb(111 159 145 / 22%);
      }

      .nation-select__option:focus-visible {
        outline: 2px solid #fff176;
        outline-offset: 2px;
      }

      .nation-clock__autopilot {
        min-height: 44px;
        padding: 0 0.6rem;
        color: var(--world-parchment);
        font-family: inherit;
        font-size: 0.75rem;
        background: transparent;
        border: 1px solid var(--world-iron);
        border-radius: 0.25rem;
        cursor: pointer;
      }

      .nation-clock__autopilot[aria-pressed="true"] {
        background: rgb(111 159 145 / 28%);
        border-color: var(--world-verdigris, #6f9f91);
      }

      .nation-clock__autopilot[aria-disabled="true"] {
        color: var(--world-iron);
        cursor: default;
      }

      .nation-clock__autopilot:focus-visible,
      .nation-dashboard__cancel:focus-visible,
      .nation-dashboard__choose:focus-visible,
      .directive-panel__submit:focus-visible {
        outline: 2px solid #fff176;
        outline-offset: 2px;
      }

      .nation-dashboard__commit {
        margin: 0.25rem 0;
        font-size: 0.85rem;
      }

      /* The one warning state: autopilot off with nothing queued, so the season resolves into nothing. */
      .nation-dashboard__commit--idle {
        color: #e5a25f;
      }

      .nation-dashboard__commit-detail {
        margin: 0.15rem 0;
        color: var(--world-iron);
        font-size: 0.75rem;
      }

      .nation-dashboard__commit-controls {
        display: flex;
        gap: 0.4rem;
        margin: 0.4rem 0 0;
      }

      .nation-dashboard__cancel,
      .nation-dashboard__choose {
        min-height: 44px;
        padding: 0 0.6rem;
        color: var(--world-parchment);
        font-family: inherit;
        font-size: 0.75rem;
        background: transparent;
        border: 1px solid var(--world-iron);
        border-radius: 0.25rem;
        cursor: pointer;
      }

      .directive-panel {
        position: fixed;
        z-index: 11;
        top: 3.5rem;
        right: 0.5rem;
        bottom: 0.5rem;
        box-sizing: border-box;
        width: min(22rem, 92vw);
        padding: 0.75rem;
        overflow-y: auto;
        color: var(--world-parchment);
        font-family: system-ui, sans-serif;
        font-size: 0.8rem;
        background: rgb(29 36 40 / 97%);
        border: 1px solid var(--world-iron);
        border-radius: 0.35rem;
      }

      .directive-panel__title {
        margin: 0 0 0.5rem;
        font-size: 1rem;
      }

      .directive-panel__mode {
        margin: 0;
        font-size: 0.8rem;
      }

      .directive-panel__mode-description {
        margin: 0.15rem 0 0.6rem;
        color: var(--world-iron);
        font-size: 0.7rem;
        line-height: 1.5;
      }

      .directive-panel__refusal {
        margin: 0 0 0.6rem;
        padding: 0.4rem 0.5rem;
        color: #f2b8b5;
        background: rgb(140 60 55 / 30%);
        border: 1px solid #8c3c37;
        border-radius: 0.25rem;
      }

      .directive-panel__options {
        display: grid;
        gap: 0.5rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .directive-panel__option {
        padding: 0.5rem;
        border: 1px solid var(--world-iron);
        border-radius: 0.25rem;
      }

      /* Dimmed, never removed: a blocked option keeps its place in the list and in the tab order. */
      .directive-panel__option--blocked {
        background: rgb(111 159 145 / 6%);
        border-style: dashed;
      }

      .directive-panel__header {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        justify-content: space-between;
        margin: 0;
      }

      .directive-panel__name {
        font-size: 0.9rem;
      }

      .directive-panel__duration,
      .directive-panel__affinity-label {
        color: var(--world-iron);
        font-size: 0.7rem;
      }

      .directive-panel__cost {
        margin: 0.25rem 0;
        font-variant-numeric: tabular-nums;
      }

      .directive-panel__affinity {
        display: block;
        width: 100%;
        height: 0.35rem;
      }

      .directive-panel__note {
        margin: 0.25rem 0;
        color: var(--world-iron);
        font-size: 0.7rem;
      }

      .directive-panel__star {
        margin: 0.25rem 0;
        color: #fff176;
        font-size: 0.7rem;
      }

      .directive-panel__blocked {
        margin: 0.25rem 0;
        color: #e5a25f;
        font-size: 0.7rem;
      }

      .directive-panel__submit {
        min-height: 44px;
        margin-top: 0.35rem;
        padding: 0 0.6rem;
        color: var(--world-parchment);
        font-family: inherit;
        font-size: 0.75rem;
        background: transparent;
        border: 1px solid var(--world-iron);
        border-radius: 0.25rem;
        cursor: pointer;
      }

      .directive-panel__submit[aria-disabled="true"] {
        color: var(--world-iron);
        border-style: dashed;
        cursor: default;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .inspect-panel {
        position: fixed;
        z-index: 10;
        top: 0;
        right: 0;
        bottom: 0;
        box-sizing: border-box;
        width: min(22rem, 40vw);
        padding: calc(1rem + env(safe-area-inset-top)) 1rem
          calc(1rem + env(safe-area-inset-bottom));
        overflow-y: auto;
        color: #f4f0df;
        background: rgb(29 36 40 / 96%);
        border-left: 1px solid #54646b;
        box-shadow: -0.25rem 0 1rem rgb(0 0 0 / 35%);
        font-family: system-ui, sans-serif;
        touch-action: pan-y;
        overscroll-behavior: contain;
      }

      .inspect-panel[hidden] {
        display: none;
      }

      .inspect-panel__header {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }

      .inspect-panel__name {
        margin: 0;
        font-size: 1.4rem;
      }

      .inspect-panel__badge {
        padding: 0.15rem 0.45rem;
        border: 1px solid currentcolor;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .inspect-panel__badge--llm {
        color: #ffd75a;
      }

      .inspect-panel__badge--fake {
        color: #9bd59b;
      }

      .inspect-panel__close {
        margin-left: auto;
        padding: 0.15rem 0.45rem;
        color: inherit;
        background: transparent;
        border: 0;
        font-size: 1.6rem;
        line-height: 1;
        cursor: pointer;
      }

      .inspect-panel__section-title {
        margin: 1.2rem 0 0.35rem;
        color: #b9c8cd;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .inspect-panel__activity,
      .inspect-panel__empty,
      .inspect-panel__food-security {
        margin: 0;
      }

      .inspect-panel__food-security {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-variant-numeric: tabular-nums;
      }

      .inspect-panel__society-list {
        display: grid;
        gap: 0.55rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .inspect-panel__society-row {
        padding-left: 0.65rem;
        border-left: 2px solid var(--world-verdigris);
      }

      .inspect-panel__society-name {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: 0.9rem;
      }

      .inspect-panel__society-detail,
      .inspect-panel__society-people {
        margin: 0.18rem 0 0;
        font-family: system-ui, sans-serif;
        font-size: 0.76rem;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }

      .inspect-panel__society-detail {
        color: #b9c8cd;
      }

      .inspect-panel__needs {
        display: grid;
        gap: 0.45rem;
        margin: 0;
      }

      .inspect-panel__need {
        --need-color: #d6b85a;
        display: grid;
        grid-template-columns: 4.5rem minmax(5rem, 1fr) 2.2rem;
        align-items: center;
        gap: 0.55rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.75rem;
      }

      .inspect-panel__need--hunger {
        --need-color: #d7a64f;
      }

      .inspect-panel__need--fatigue {
        --need-color: #78a9c2;
      }

      .inspect-panel__need--health {
        --need-color: #8ec07c;
      }

      .inspect-panel__need-label,
      .inspect-panel__need-value {
        margin: 0;
      }

      .inspect-panel__need-value {
        color: #f4f0df;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .inspect-panel__need-meter {
        width: 100%;
        height: 0.55rem;
        overflow: hidden;
        accent-color: var(--need-color);
        background: #11171a;
        border: 1px solid #54646b;
        border-radius: 0;
      }

      .inspect-panel__need-meter::-webkit-progress-bar {
        background: #11171a;
      }

      .inspect-panel__need-meter::-webkit-progress-value {
        background: var(--need-color);
      }

      .inspect-panel__need-meter::-moz-progress-bar {
        background: var(--need-color);
      }

      .inspect-panel__tasks {
        margin: 0;
        padding-left: 1.4rem;
      }

      .inspect-panel__task + .inspect-panel__task {
        margin-top: 0.3rem;
      }

      .inspect-panel__thought {
        margin: 0;
        padding: 0.75rem 0 0.75rem 1rem;
        color: #fff8dc;
        border-left: 3px solid #d6b85a;
        font-family: Georgia, serif;
        font-style: italic;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .chronicle-toggle {
        position: fixed;
        z-index: 8;
        top: calc(1rem + env(safe-area-inset-top));
        right: calc(1rem + env(safe-area-inset-right));
        min-height: 44px;
        padding: 0.55rem 0.8rem;
        color: var(--world-parchment);
        background: rgb(24 33 38 / 94%);
        border: 1px solid var(--world-verdigris);
        box-shadow: 0.2rem 0.2rem 0 rgb(0 0 0 / 28%);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        transition:
          color 140ms ease,
          border-color 140ms ease,
          transform 140ms ease;
      }

      .traffic-overlay-toggle {
        position: fixed;
        z-index: 8;
        top: calc(5.4rem + env(safe-area-inset-top));
        left: calc(1rem + env(safe-area-inset-left));
        min-height: 44px;
        padding: 0.55rem 0.8rem;
        color: var(--world-parchment);
        background: rgb(29 36 40 / 94%);
        border: 1px solid var(--world-verdigris);
        box-shadow: 0.2rem 0.2rem 0 rgb(0 0 0 / 28%);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        cursor: pointer;
        transition:
          color 140ms ease,
          background 140ms ease,
          transform 140ms ease;
      }

      .traffic-overlay-toggle:hover {
        color: #fff8dc;
        transform: translate(-1px, -1px);
      }

      .traffic-overlay-toggle[aria-pressed="true"] {
        color: var(--world-peat);
        background: var(--world-verdigris);
      }

      .chronicle-toggle:hover {
        color: #fff8dc;
        border-color: var(--world-parchment);
        transform: translate(-1px, -1px);
      }

      .chronicle-toggle:focus-visible,
      .traffic-overlay-toggle:focus-visible,
      .inspect-panel__close:focus-visible,
      .world-chronicle__close:focus-visible,
      .world-chronicle__tab:focus-visible {
        outline: 2px solid #fff176;
        outline-offset: 2px;
      }

      .chronicle-toggle[hidden],
      .world-chronicle[hidden],
      .world-chronicle__map-panel[hidden],
      .world-chronicle__chronicle-panel[hidden] {
        display: none;
      }

      .world-chronicle {
        position: fixed;
        z-index: 12;
        top: 0;
        right: 0;
        bottom: 0;
        box-sizing: border-box;
        width: min(38rem, 48vw);
        padding: calc(1.1rem + env(safe-area-inset-top)) 1.25rem
          calc(1.5rem + env(safe-area-inset-bottom));
        overflow-y: auto;
        color: var(--world-parchment);
        background:
          linear-gradient(90deg, rgb(111 159 145 / 10%) 0 2px, transparent 2px),
          rgb(20 27 30 / 98%);
        border-left: 1px solid var(--world-verdigris);
        box-shadow: -0.5rem 0 1.5rem rgb(0 0 0 / 42%);
        font-family: Georgia, "Times New Roman", serif;
        touch-action: pan-y;
        overscroll-behavior: contain;
        transition: transform 180ms ease;
      }

      .world-chronicle__header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 0.2rem 1rem;
        padding-bottom: 0.8rem;
        border-bottom: 1px solid var(--world-iron);
      }

      .world-chronicle__title {
        margin: 0;
        font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
        font-size: clamp(1.45rem, 3vw, 2.15rem);
        font-weight: 400;
        letter-spacing: 0.02em;
      }

      .world-chronicle__era {
        grid-column: 1;
        margin: 0;
        color: #aebdb9;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .world-chronicle__close {
        grid-row: 1 / span 2;
        grid-column: 2;
        min-width: 44px;
        min-height: 44px;
        padding: 0.35rem 0.55rem;
        color: var(--world-parchment);
        background: transparent;
        border: 1px solid var(--world-iron);
        font: 0.7rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        text-transform: uppercase;
        cursor: pointer;
      }

      .world-chronicle__tabs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-top: 0.9rem;
        border-bottom: 1px solid var(--world-iron);
      }

      .world-chronicle__tab {
        min-height: 44px;
        padding: 0.55rem 0.75rem;
        color: #9fb0ad;
        background: transparent;
        border: 0;
        border-bottom: 3px solid transparent;
        font: 700 0.72rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
        cursor: pointer;
      }

      .world-chronicle__tab[aria-selected="true"] {
        color: #fff8dc;
        background: rgb(111 159 145 / 9%);
        border-bottom-color: var(--world-verdigris);
      }

      .world-chronicle__map-panel {
        margin-top: 1rem;
      }

      .world-chronicle__map-canvas-wrapper {
        width: 100%;
        aspect-ratio: 3 / 2;
        overflow: hidden;
        background: #1b3442;
        border: 1px solid var(--world-iron);
        box-shadow: inset 0 0 0 1px rgb(222 211 179 / 8%);
      }

      .world-chronicle__map-canvas {
        width: 100%;
        height: auto;
        aspect-ratio: 3 / 2;
        image-rendering: pixelated;
        cursor: crosshair;
        touch-action: manipulation;
      }

      .world-chronicle__map-legend {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.8rem;
        margin-top: 0.8rem;
      }

      .world-chronicle__legend-group {
        min-width: 0;
      }

      .world-chronicle__legend-title {
        margin: 0 0 0.35rem;
        color: #c5d5d0;
        font: 0.65rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.1em;
      }

      .world-chronicle__legend-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem 0.65rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .world-chronicle__legend-item {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        color: #c9c3ae;
        font: 0.67rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .world-chronicle__legend-symbol {
        color: #f1e8ce;
        line-height: 1;
        text-shadow: 0 1px 0 #141b1e;
      }

      .world-chronicle__legend-symbol--sea {
        color: #31566a;
      }

      .world-chronicle__legend-symbol--plains {
        color: #7d8c62;
      }

      .world-chronicle__legend-symbol--forest {
        color: #56745e;
      }

      .world-chronicle__legend-symbol--hills {
        color: #9a886c;
      }

      .world-chronicle__legend-symbol--mountains {
        color: #c8c0b2;
      }

      .world-chronicle__legend-symbol--capital,
      .world-chronicle__legend-symbol--route {
        color: #fff176;
      }

      .world-chronicle__legend-symbol--settlement {
        color: #f0d57b;
      }

      .world-chronicle__map-selection {
        margin-top: 1rem;
      }

      .world-chronicle__map-prompt {
        margin: 0;
        padding: 0.75rem;
        color: #aebdb9;
        border: 1px dashed var(--world-iron);
        font-size: 0.78rem;
        text-align: center;
      }

      .world-chronicle__section-title {
        margin: 1.4rem 0 0.7rem;
        color: #c5d5d0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.68rem;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .world-chronicle__origin {
        position: relative;
        padding-left: 1rem;
      }

      .world-chronicle__origin::before {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 2px;
        background: var(--world-verdigris);
        content: "";
      }

      .world-chronicle__homeland {
        margin: 0;
        font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
        font-size: 1.3rem;
      }

      .world-chronicle__origin-reason {
        margin: 0.4rem 0 0.7rem;
        color: #f1e8ce;
        font-size: 0.92rem;
        line-height: 1.5;
      }

      .world-chronicle__detail {
        display: grid;
        grid-template-columns: minmax(7rem, 0.35fr) minmax(0, 1fr);
        gap: 0.75rem;
        margin: 0.45rem 0 0;
        font-size: 0.78rem;
        line-height: 1.45;
      }

      .world-chronicle__detail-label {
        color: #9fb0ad;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.65rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .world-chronicle__polity-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.8rem;
      }

      .world-chronicle__polity {
        padding: 0.75rem 0.75rem 0.85rem;
        background: rgb(255 255 255 / 2.5%);
        border-left: 3px solid var(--polity-color, var(--world-iron));
      }

      .world-chronicle__polity--homeland {
        background: rgb(111 159 145 / 9%);
        box-shadow: inset 0 0 0 1px rgb(111 159 145 / 20%);
      }

      .world-chronicle__polity-name {
        margin: 0;
        font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
        font-size: 1rem;
        font-weight: 600;
      }

      .world-chronicle__values {
        display: grid;
        gap: 0.3rem;
        margin: 0.35rem 0 0.8rem;
        padding: 0;
        list-style: none;
      }

      .world-chronicle__value-label {
        color: #bfd0cb;
        font: 0.62rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .world-chronicle__value-cause {
        display: block;
        margin-top: 0.05rem;
        color: #a9aaa0;
        font-size: 0.68rem;
        line-height: 1.35;
      }

      .world-chronicle__polity .world-chronicle__detail {
        display: block;
      }

      .world-chronicle__polity .world-chronicle__detail-label {
        display: block;
        margin-bottom: 0.08rem;
      }

      .world-chronicle__events {
        position: relative;
        margin: 0;
        padding: 0 0 0 1.2rem;
        list-style: none;
      }

      .world-chronicle__events::before {
        position: absolute;
        top: 0.2rem;
        bottom: 0.2rem;
        left: 0.24rem;
        width: 1px;
        background: var(--world-iron);
        content: "";
      }

      .world-chronicle__event {
        position: relative;
        padding: 0 0 1rem 0.55rem;
      }

      .world-chronicle__event::before {
        position: absolute;
        top: 0.3rem;
        left: -1.18rem;
        width: 7px;
        height: 7px;
        background: var(--world-iron);
        border: 2px solid #141b1e;
        content: "";
        transform: rotate(45deg);
      }

      .world-chronicle__event--war::before,
      .world-chronicle__event--scarcity::before {
        background: var(--world-ember);
      }

      .world-chronicle__event--trade::before,
      .world-chronicle__event--migration::before {
        background: var(--world-verdigris);
      }

      .world-chronicle__event--anomaly::before {
        background: var(--world-ley);
        box-shadow: 0 0 0.45rem rgb(136 120 166 / 65%);
      }

      .world-chronicle__event-heading {
        display: grid;
        grid-template-columns: 3.1rem minmax(0, 1fr);
        gap: 0.55rem;
        align-items: baseline;
      }

      .world-chronicle__event-year {
        color: #9fb0ad;
        font: 0.68rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .world-chronicle__event-title {
        margin: 0;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .world-chronicle__event-summary {
        margin: 0.2rem 0 0 3.65rem;
        color: #c9c3ae;
        font-size: 0.78rem;
        line-height: 1.45;
      }

      .world-chronicle__event .world-chronicle__detail {
        margin-left: 3.65rem;
      }

      @media (prefers-reduced-motion: reduce) {
        .world-chronicle,
        .chronicle-toggle,
        .traffic-overlay-toggle {
          transition: none;
        }
      }

      @media (max-width: 600px) {
        .inspect-panel {
          top: auto;
          left: 0;
          width: auto;
          max-height: 48dvh;
          border-top: 1px solid #54646b;
          border-left: 0;
          box-shadow: 0 -0.25rem 1rem rgb(0 0 0 / 35%);
        }

        .chronicle-toggle {
          right: calc(0.65rem + env(safe-area-inset-right));
        }

        .traffic-overlay-toggle {
          top: calc(5.4rem + env(safe-area-inset-top));
          left: calc(0.65rem + env(safe-area-inset-left));
        }

        .world-chronicle {
          top: auto;
          left: 0;
          width: auto;
          max-height: 72dvh;
          border-top: 1px solid var(--world-verdigris);
          border-left: 0;
          box-shadow: 0 -0.5rem 1.5rem rgb(0 0 0 / 42%);
        }

        .world-chronicle__polity-grid {
          grid-template-columns: 1fr;
        }

        .world-chronicle__map-legend {
          grid-template-columns: 1fr;
        }

        .world-chronicle__detail {
          grid-template-columns: 1fr;
          gap: 0.1rem;
        }
      }
    </style>
  </head>
  <body>
    <p id="world-instructions" class="visually-hidden">
      エージェント・タウンの世界は矢印キーで探索できます。改行キーまたは空白キーで現在のタイルを調べます。
      住民を二度選ぶと詳細が開きます。エスケープキーで選択を閉じます。
    </p>
    <div
      id="world-status"
      class="visually-hidden"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <button
      id="chronicle-toggle"
      class="chronicle-toggle"
      type="button"
      aria-controls="world-chronicle"
      aria-expanded="false"
      hidden
    >
      旧世界を見る
    </button>
    <!-- Resident-era control. Nothing wires it since main.ts became the nation shell, so it is hidden
         rather than deleted: the resident renderers are still in the tree and C1-7 docks the city view. -->
    <button
      id="traffic-overlay-toggle"
      class="traffic-overlay-toggle"
      type="button"
      aria-pressed="false"
      hidden
    >
      通行量を表示
    </button>
    <!-- A section rather than a div: an accessible name needs a role to attach to, and section with a
         name is a region. -->
    <section id="nation-clock" class="nation-clock" aria-label="暦と進行速度"></section>
    <main class="nation-hud">
      <section
        id="nation-dashboard"
        class="nation-dashboard"
        aria-label="自国の状況"
      ></section>
      <section id="nation-ranking" class="prosperity" aria-label="繁栄度の順位"></section>
    </main>
    <!-- Hidden until `D` or 施策を選ぶ opens it. `hidden` on the container is fine; what must never be
         `disabled` is a blocked option inside it, which would take its own explanation out of reach. -->
    <aside
      id="directive-panel"
      class="directive-panel"
      aria-label="施策の選択"
      hidden
    ></aside>
    <aside
      id="nation-select"
      class="nation-select"
      aria-label="国の選択"
      hidden
    ></aside>
    <aside
      id="world-chronicle"
      class="world-chronicle"
      aria-labelledby="world-chronicle-title"
      hidden
    ></aside>
    <aside
      id="inspect-panel"
      class="inspect-panel"
      aria-labelledby="inspect-panel-name"
      hidden
    ></aside>
    <!-- The page's only unconditional content. Every panel below is empty until a `welcome` arrives,
         so without this a page whose script never ran, or whose socket never opened, is an unbroken
         dark rectangle that says nothing about which of the two went wrong. `main.ts` clears it on the
         first `welcome` and restores it on a disconnect. Being markup rather than script is the point:
         it survives the failure where no script runs at all. -->
    <p id="nation-boot" class="nation-boot" role="status">世界に接続しています…</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
